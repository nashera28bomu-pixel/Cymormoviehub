<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cymor Movie Hub | Premium Streaming</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css"/>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">
    <div class="nav-container">

      <div class="logo">
        <i class="fas fa-film"></i> CYMOR<span>HUB</span>
      </div>

      <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search movies, series, actors..."/>
      </div>

      <div class="nav-links">
        <a href="/" class="active">Home</a>
        <a href="/movies">Movies</a>
        <a href="/series">Series</a>
      </div>

    </div>
  </nav>

  <!-- ================= HERO SECTION ================= -->
  <header id="hero" class="hero-section">

    <div class="hero-overlay"></div>

    <!-- Dynamic content injected by script.js -->
    <div id="heroContent" class="hero-content">

      <!-- fallback loader (shown before JS loads content) -->
      <div class="hero-loader">
        <div class="skeleton-title"></div>
        <div class="skeleton-text"></div>
        <div class="skeleton-buttons"></div>
      </div>

    </div>

  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="content-wrapper">

    <!-- Trending -->
    <section class="movie-section">
      <div class="section-header">
        <h2><i class="fas fa-fire"></i> Trending Now</h2>
        <a href="/movies" class="view-all">View All</a>
      </div>

      <div class="movie-row-container">
        <div class="movie-row" id="trending"></div>
      </div>
    </section>

    <!-- Popular -->
    <section class="movie-section">
      <div class="section-header">
        <h2><i class="fas fa-star"></i> Most Popular</h2>
        <a href="/movies" class="view-all">View All</a>
      </div>

      <div class="movie-row-container">
        <div class="movie-row" id="popular"></div>
      </div>
    </section>

    <!-- Top Rated -->
    <section class="movie-section">
      <div class="section-header">
        <h2><i class="fas fa-award"></i> Critics' Choice</h2>
        <a href="/movies" class="view-all">View All</a>
      </div>

      <div class="movie-row-container">
        <div class="movie-row" id="toprated"></div>
      </div>
    </section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="main-footer">
    <p>&copy; 2026 Cymor Movie Hub. MADE BY CYMOR😎.</p>
  </footer>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
