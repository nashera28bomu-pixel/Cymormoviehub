<div class="watch-layout">
    <button onclick="history.back()" class="back-btn">← Back</button>
    
    <div id="player-wrapper">
        <div class="preview-tag">PREVIEW - 15 MIN</div>
        <iframe id="player" src="" allowfullscreen></iframe>
    </div>

    <div class="movie-details">
        <h1 id="movieTitle"></h1>
        <div class="meta-row">
            <span id="movieRating"></span>
            <span id="movieYear"></span>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showTab('info')">Info</div>
            <div class="tab" onclick="showTab('cast')">Cast</div>
            <div class="tab" onclick="showTab('download')">Download</div>
        </div>

        <div id="tab-content">
            <!-- Content dynamically injected here -->
        </div>
    </div>
</div>
