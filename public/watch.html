<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cymor Movie Hub - Watching</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="watch-page">
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo"><i class="fas fa-film"></i> CYMOR <span>MOVIE HUB</span></a>
            <div class="nav-links">
                <a href="/">Home</a>
            </a>
        </div>
    </nav>

    <main class="player-container">
        <!-- Video Player -->
        <div class="video-wrapper">
            <div class="player-overlay">AUTO-QUALITY / MULTI-SUB</div>
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>

        <!-- Header Info -->
        <div class="movie-detail-header">
            <h1 id="movieTitle">Loading...</h1>
            <div class="action-bar">
                <button class="now-playing-btn"><i class="fas fa-play"></i> Now Playing</button>
                <button class="download-primary" id="mainDownload"><i class="fas fa-download"></i> Download</button>
            </div>
        </div>

        <!-- Overview Section -->
        <p id="movieOverview" style="margin-bottom: 25px; color: var(--muted); line-height: 1.6;"></p>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('info')">Info</div>
            <div id="episodeTab" class="tab" style="display:none;" onclick="switchTab('episode')">Episodes</div>
            <div class="tab" onclick="switchTab('cast')">Cast</div>
        </div>

        <!-- Tab Panes -->
        <div class="tab-content-wrapper">
            <!-- Info Pane: Shows Recommendations -->
            <div id="infoPane" class="pane active">
                <h3 style="margin-bottom: 15px; font-size: 0.9rem; letter-spacing: 1px;">YOU MAY ALSO LIKE</h3>
                <div class="movie-row" id="similarMovies">
                    <!-- Recommendations will load here -->
                </div>
            </div>

            <!-- Episode Pane -->
            <div id="episodePane" class="pane">
                <div class="episode-grid" id="episodeGrid">
                    <!-- Episode boxes will load here -->
                </div>
            </div>

            <!-- Cast Pane -->
            <div id="castPane" class="pane">
                <div class="cast-list" id="castList">
                    <!-- Cast cards will load here -->
                </div>
            </div>
        </div>
    </main>

    <script src="watch-logic.js"></script>
</body>
</html>
