<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Streaming - Cymor Movie Hub</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

        body { background: #060d17; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }

        /* ── ELITE HYBRID PLAYER CONTAINER ── */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 1.5rem;
            background: #000;
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.1);
        }

        /* Support for both iframe and native video */
        .video-container iframe, 
        .video-container video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
            outline: none;
        }

        /* Custom Subtitle Styling for native player */
        video::cue {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 1.2rem;
            font-family: 'Inter', sans-serif;
        }

        .server-btn.active {
            background: rgba(6,182,212,0.25);
            border-color: rgba(6,182,212,0.6);
            color: #22d3ee;
        }

        .bg-blur {
            position: fixed; inset: 0; z-index: -1;
            background-size: cover; background-position: center;
            filter: blur(100px) brightness(0.15); transform: scale(1.2);
            transition: background-image 0.8s ease;
        }

        .skeleton {
            background: linear-gradient(90deg, #131a26 25%, #1f2937 50%, #131a26 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>

<body class="pb-20">

    <div id="dynamic-bg" class="bg-blur"></div>

    <nav class="fixed top-0 left-0 w-full z-50 px-6 py-4 bg-gradient-to-b from-black/95 to-transparent backdrop-blur-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 group text-gray-300 hover:text-cyan-400 transition">
                <i class="fa-solid fa-arrow-left text-lg group-hover:-translate-x-1 transition"></i>
                <span class="uppercase text-xs tracking-widest font-black">Back to Hub</span>
            </a>
            <h1 class="font-black uppercase tracking-tighter text-xl">
                <span class="text-cyan-400">Cymor</span> Hub
            </h1>
        </div>
    </nav>

    <main class="pt-24 px-4 md:px-10 lg:px-20 max-w-[1600px] mx-auto">

        <div class="flex flex-col xl:flex-row gap-8 mb-6">

            <div class="flex-[3]">
                <div id="player-wrapper" class="video-container">
                    <div class="absolute inset-0 flex flex-col items-center justify-center space-y-4">
                        <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                        <p class="text-xs font-black uppercase tracking-[0.3em] text-cyan-500 animate-pulse">Initializing Ad-Free Stream</p>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mt-6">
                    <div class="flex items-center gap-3 flex-wrap">
                        <span class="text-[10px] uppercase tracking-widest font-black text-gray-500">Source:</span>
                        <button id="btn-server-primary" onclick="switchServer('primary')"
                            class="server-btn active text-[10px] px-4 py-2 rounded-full border border-white/10 font-bold uppercase transition">
                            <i class="fa-solid fa-bolt mr-1 text-cyan-400"></i> Elite (Ad-Free)
                        </button>
                        <button id="btn-server-fallback" onclick="switchServer('fallback')"
                            class="server-btn text-[10px] px-4 py-2 rounded-full border border-white/10 font-bold uppercase transition hover:bg-white/5">
                            <i class="fa-solid fa-server mr-1"></i> Fallback
                        </button>
                    </div>

                    <div id="subtitle-status" class="hidden flex items-center gap-2">
                        <span class="text-[10px] font-black text-cyan-400 uppercase tracking-widest">Subtitles Loaded</span>
                        <div id="subtitle-controls" class="flex gap-2"></div>
                    </div>
                </div>
            </div>

            <div id="episode-parent" class="flex-[1] hidden">
                <div class="glass rounded-[1.5rem] h-full max-h-[600px] overflow-hidden flex flex-col">
                    <div class="p-5 border-b border-white/10 flex justify-between items-center bg-white/5">
                        <div>
                            <h3 class="font-black text-sm uppercase tracking-widest text-cyan-400">Episodes</h3>
                            <p id="season-label" class="text-[10px] font-bold opacity-40 uppercase">Season 1</p>
                        </div>
                        <i class="fa-solid fa-list-ul text-gray-600"></i>
                    </div>
                    <div id="episode-selector-container" class="p-4 overflow-y-auto custom-scroll space-y-2">
                        <div class="h-14 skeleton rounded-xl opacity-20"></div>
                        <div class="h-14 skeleton rounded-xl opacity-20"></div>
                    </div>
                </div>
            </div>
        </div>

        <section class="flex flex-col lg:flex-row gap-10 border-b border-white/5 pb-16 mb-16 mt-8">
            <div class="flex-1">
                <div class="flex items-center gap-4 mb-6">
                    <span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3 py-1 rounded text-[10px] font-black uppercase">Elite Stream</span>
                    <span id="watch-rating" class="text-white font-black text-sm"><i class="fa-solid fa-star text-yellow-500 mr-1"></i> --</span>
                    <span id="watch-year" class="text-gray-500 font-bold text-sm">----</span>
                </div>
                <h1 id="watch-title" class="text-4xl md:text-7xl font-black mb-6 uppercase tracking-tighter leading-none italic">Loading...</h1>
                <p id="watch-desc" class="text-gray-400 leading-relaxed text-lg max-w-4xl font-medium">Fetching media information...</p>
            </div>

            <div class="w-full lg:w-[320px] shrink-0">
                <div class="glass rounded-[2.5rem] p-8 space-y-4 text-center">
                    <a id="btn-download" href="#" class="bg-white text-black py-4 rounded-2xl font-black flex items-center justify-center gap-3 transition hover:bg-cyan-400 hover:scale-[1.05]">
                        <i class="fa-solid fa-cloud-arrow-down text-lg"></i> HIGH-SPEED DL
                    </a>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="window.location.href=document.getElementById('btn-download').href.replace('download','details')"
                            class="glass hover:bg-white/5 py-3 rounded-xl font-bold text-xs uppercase transition">Details</button>
                        <button onclick="navigator.share && navigator.share({title: document.getElementById('watch-title').innerText, url: window.location.href})"
                            class="glass hover:bg-white/5 py-3 rounded-xl font-bold text-xs uppercase transition">Share</button>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="flex items-center gap-3 mb-10">
                <div class="w-1.5 h-6 bg-cyan-500 rounded-full"></div>
                <h2 class="text-2xl font-black uppercase tracking-tighter italic">Recommended</h2>
            </div>
            <div id="recommended-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
                </div>
        </section>

    </main>

    <script src="script.js"></script>
    <script>
        // Server switching logic for the new Hybrid Player
        window._streamUrls = { primary: '', fallback: '', type: 'movie' };

        function switchServer(which) {
            const url = window._streamUrls[which];
            if (!url) return;

            const container = document.getElementById('player-wrapper');
            
            if (which === 'primary' && (url.includes('.m3u8') || url.includes('.mp4'))) {
                // Re-initialize native player for Elite Server
                window.setupPlayer(url, []); 
            } else {
                // Use Iframe for Fallback
                container.innerHTML = `<iframe id="video-player" src="${url}" allowfullscreen allow="autoplay; fullscreen" sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-presentation"></iframe>`;
            }

            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-server-${which}`)?.classList.add('active');
        }
    </script>
</body>
</html>
