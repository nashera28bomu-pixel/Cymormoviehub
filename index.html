<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Cymor Movie Hub | Unlimited Streaming</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        body{
            background:#060d17;
            color:white;
            font-family:'Inter',sans-serif;
            overflow-x:hidden;
        }

        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-thumb{background:#06b6d4;border-radius:999px}

        .glass{
            background:rgba(255,255,255,0.03);
            backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.08);
        }

        .hero-gradient{
            background:linear-gradient(to top,#060d17 8%,rgba(6,13,23,0.4) 45%,rgba(6,13,23,0.1) 100%);
        }

        .movie-card{
            position:relative;
            overflow:hidden;
            border-radius:28px;
            cursor:pointer;
            transition:0.4s ease;
        }

        .movie-card:hover{
            transform:translateY(-8px) scale(1.02);
        }

        .movie-card img{
            transition:0.5s ease;
        }

        .movie-card:hover img{
            transform:scale(1.08);
        }

        .skeleton{
            background:linear-gradient(90deg,#131a26 25%,#1f2937 50%,#131a26 75%);
            background-size:200% 100%;
            animation:shimmer 1.5s infinite;
        }

        @keyframes shimmer{
            0%{background-position:200% 0}
            100%{background-position:-200% 0}
        }

        .fade-in{
            animation:fade 1s ease;
        }

        @keyframes fade{
            from{opacity:0;transform:translateY(15px)}
            to{opacity:1;transform:translateY(0)}
        }

        .glow{
            box-shadow:0 0 40px rgba(6,182,212,0.15);
        }
    </style>
</head>

<body>

<!-- BACKGROUND GLOW -->
<div class="fixed top-[-10%] left-[-10%] w-[400px] h-[400px] bg-cyan-500/10 blur-[120px] rounded-full -z-50"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-blue-500/10 blur-[120px] rounded-full -z-50"></div>

<!-- NAVBAR -->
<nav class="sticky top-0 z-[100] px-6 py-5 glass flex items-center justify-between">

    <!-- LOGO -->
    <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-cyan-500/20 flex items-center justify-center glow">
            <i class="fa-solid fa-clapperboard text-cyan-400 text-xl"></i>
        </div>

        <div>
            <h1 class="text-xl font-black uppercase">
                <span class="text-cyan-400">Cymor</span> Movie Hub
            </h1>
        </div>
    </div>

    <!-- ACTIONS -->
    <div class="flex items-center gap-3">

        <!-- 🔥 NETFLIX SEARCH BUTTON -->
        <button id="open-search" class="w-11 h-11 rounded-2xl glass hover:bg-cyan-500/20 transition">
            <i class="fa-solid fa-search"></i>
        </button>

        <button class="w-11 h-11 rounded-2xl glass hover:bg-cyan-500/20 transition">
            <i class="fa-solid fa-bell"></i>
        </button>

    </div>

</nav>

<!-- HERO -->
<section class="relative w-full h-[78vh] mt-6 flex items-end px-8 pb-16 overflow-hidden rounded-[3rem] mx-auto max-w-[97%]">

    <img id="hero-backdrop" class="absolute inset-0 w-full h-full object-cover opacity-0 transition duration-1000"/>

    <div class="absolute inset-0 hero-gradient"></div>

    <div class="max-w-2xl fade-in z-10">

        <h2 id="hero-title" class="text-5xl font-black mb-4"></h2>

        <p id="hero-description" class="text-gray-300 mb-6"></p>

        <div class="flex gap-4">

            <!-- CONTROLLED BY JS (NO DIRECT REDIRECT LOGIC) -->
            <button id="hero-watch-btn"
                class="bg-cyan-500 px-8 py-4 rounded-2xl font-black hover:bg-cyan-600">
                <i class="fa-solid fa-play"></i> WATCH
            </button>

            <a id="hero-details-btn"
               class="glass px-8 py-4 rounded-2xl font-black">
                DETAILS
            </a>

        </div>

    </div>

</section>

<!-- MAIN -->
<main class="px-6 py-14">

    <h3 class="text-3xl font-black mb-6">TRENDING NOW</h3>

    <div id="trending-grid"
         class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">

        <!-- skeletons -->
        <div class="h-[320px] rounded-2xl skeleton"></div>
        <div class="h-[320px] rounded-2xl skeleton"></div>
        <div class="h-[320px] rounded-2xl skeleton"></div>
        <div class="h-[320px] rounded-2xl skeleton"></div>
        <div class="h-[320px] rounded-2xl skeleton"></div>

    </div>

</main>

<!-- 🔥 NETFLIX SEARCH OVERLAY -->
<div id="search-overlay" class="hidden fixed inset-0 bg-black/95 z-[9999] p-6 overflow-y-auto">

    <div class="max-w-2xl mx-auto mt-10">

        <input
            id="search-input"
            type="text"
            placeholder="Search movies, series..."
            class="w-full p-4 text-xl rounded-xl bg-gray-900 text-white border border-gray-700"
        />

        <p class="text-gray-400 mt-2 text-sm">
            Type to search instantly (Netflix style)
        </p>

    </div>

    <div id="search-results"
         class="max-w-6xl mx-auto mt-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    </div>

    <button id="close-search"
        class="fixed top-4 right-4 bg-red-600 px-4 py-2 rounded-lg">
        Close
    </button>

</div>

<!-- MODAL -->
<div id="action-modal" class="fixed inset-0 hidden items-center justify-center z-[200]">

    <div class="absolute inset-0 bg-black/90" onclick="closeModal()"></div>

    <div class="glass p-6 rounded-3xl z-10 w-[90%] max-w-sm text-center">

        <div id="modal-poster" class="w-40 h-56 mx-auto rounded-2xl mb-4 bg-cover"></div>

        <h3 id="modal-title" class="text-xl font-black mb-6"></h3>

        <button id="modal-watch"
            class="bg-cyan-500 w-full py-3 rounded-xl font-black mb-3">
            Watch Now
        </button>

        <a id="modal-details"
           class="block bg-white/10 w-full py-3 rounded-xl mb-3">
            Details
        </a>

        <a id="modal-download"
           class="block bg-green-500 w-full py-3 rounded-xl">
            Download
        </a>

    </div>

</div>

<script>
function closeModal(){
    document.getElementById('action-modal').classList.add('hidden');
}
</script>

<!-- YOUR ENGINE -->
<script src="script.js"></script>

</body>
</html>
