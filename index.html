<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cymor Movie Hub | Unlimited Streaming</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#060d17; color:white; font-family:'Inter',sans-serif; overflow-x:hidden; }
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-thumb { background:#06b6d4; border-radius:999px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass { background:rgba(255,255,255,0.03); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.08); }
        .hero-gradient { background: linear-gradient(to top,#060d17 8%,rgba(6,13,23,0.4) 45%,rgba(6,13,23,0.1) 100%); }
        
        .movie-card { position:relative; overflow:hidden; border-radius:28px; cursor:pointer; transition:0.4s ease; }
        .movie-card:hover { transform:translateY(-8px) scale(1.02); }
        .movie-card img { transition:0.5s ease; }
        .movie-card:hover img { transform:scale(1.08); }

        .skeleton {
            background: linear-gradient(90deg, #131a26 25%, #1f2937 50%, #131a26 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
        .fade-in { animation:fade 1s ease; }
        @keyframes fade { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
        .glow { box-shadow:0 0 40px rgba(6,182,212,0.15); }
    </style>
</head>

<body>

    <div class="fixed top-[-10%] left-[-10%] w-[400px] h-[400px] bg-cyan-500/10 blur-[120px] rounded-full -z-50"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-blue-500/10 blur-[120px] rounded-full -z-50"></div>

    <nav class="sticky top-0 z-[100] px-6 md:px-10 py-5 glass">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-cyan-500/20 flex items-center justify-center glow">
                    <i class="fa-solid fa-clapperboard text-cyan-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black tracking-tight uppercase">
                        <span class="text-cyan-400">Cymor</span> Movie Hub
                    </h1>
                    <p class="text-[10px] text-gray-500 uppercase tracking-[4px]">Unlimited Streaming</p>
                </div>
            </div>

            <div class="hidden md:flex items-center gap-8 font-semibold text-sm uppercase tracking-widest">
                <a href="index.html" class="text-cyan-400">Home</a>
                <a href="movies.html" class="hover:text-cyan-400 transition">Movies</a>
                <a href="series.html" class="hover:text-cyan-400 transition">Series</a>
            </div>

            <div class="flex items-center gap-3">
                <button id="open-search" class="w-11 h-11 rounded-2xl glass hover:bg-cyan-500/20 transition">
                    <i class="fa-solid fa-search"></i>
                </button>
                <button class="md:hidden w-11 h-11 rounded-2xl glass"><i class="fa-solid fa-bars-staggered"></i></button>
            </div>
        </div>
    </nav>

    <section id="hero-container" class="relative w-full h-[78vh] mt-6 flex items-end px-8 md:px-14 pb-16 overflow-hidden rounded-[3rem] mx-auto max-w-[97%] shadow-2xl">
        <img id="hero-backdrop" src="" class="absolute inset-0 w-full h-full object-cover -z-20 opacity-0 transition duration-1000">
        <div class="absolute inset-0 hero-gradient -z-10"></div>

        <div class="max-w-2xl fade-in">
            <div class="flex items-center gap-3 mb-5">
                <span class="bg-cyan-500 text-black text-xs font-black px-4 py-1 rounded-full uppercase tracking-widest">Trending</span>
                <span class="glass px-4 py-1 rounded-full text-xs uppercase tracking-widest text-white/70">4K Ultra HD</span>
            </div>
            <h2 id="hero-title" class="text-4xl md:text-7xl font-black leading-[0.95] mb-5 tracking-tight skeleton h-16 w-3/4 rounded-xl"></h2>
            <p id="hero-description" class="text-gray-300 text-base md:text-lg mb-8 leading-relaxed line-clamp-3">
                <span class="skeleton h-4 w-full block mb-2 rounded"></span>
                <span class="skeleton h-4 w-5/6 block rounded"></span>
            </p>
            <div class="flex flex-wrap gap-4">
                <a id="hero-watch-btn" href="#" class="bg-cyan-500 hover:bg-cyan-600 px-10 py-4 rounded-2xl font-black flex items-center gap-3 transition hover:scale-105 shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-play"></i> WATCH NOW
                </a>
                <a id="hero-details-btn" href="#" class="glass hover:bg-white/10 px-10 py-4 rounded-2xl font-black flex items-center gap-3 transition">
                    <i class="fa-solid fa-circle-info"></i> DETAILS
                </a>
            </div>
        </div>
    </section>

    <section id="continue-watching-section" class="px-8 py-12 hidden">
        <div class="flex items-center gap-4 mb-6">
            <div class="w-1 h-8 bg-cyan-500 rounded-full"></div>
            <h3 class="text-2xl font-black tracking-tight uppercase">Continue Watching</h3>
        </div>
        <div id="history-grid" class="flex gap-6 overflow-x-auto pb-6 no-scrollbar">
            </div>
    </section>

    <main class="px-6 md:px-10 py-14">
        <div class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <div class="w-1 h-10 bg-cyan-500 rounded-full"></div>
                <div>
                    <h3 class="text-3xl font-black tracking-tight flex items-center gap-2">
                        <i class="fa-solid fa-fire text-orange-500"></i> TRENDING NOW
                    </h3>
                    <p class="text-gray-500 text-sm mt-1">Most watched titles worldwide.</p>
                </div>
            </div>
            <a href="movies.html" class="text-sm font-bold text-gray-400 hover:text-cyan-400 flex items-center gap-2 group transition">
                VIEW ALL <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i>
            </a>
        </div>

        <div id="trending-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <div class="h-80 rounded-[2rem] skeleton"></div>
            <div class="h-80 rounded-[2rem] skeleton"></div>
            <div class="h-80 rounded-[2rem] skeleton md:block hidden"></div>
            <div class="h-80 rounded-[2rem] skeleton lg:block hidden"></div>
            <div class="h-80 rounded-[2rem] skeleton xl:block hidden"></div>
            <div class="h-80 rounded-[2rem] skeleton xl:block hidden"></div>
        </div>
    </main>

    <div id="search-overlay" class="fixed inset-0 bg-[#060d17]/98 z-[300] hidden p-6 md:p-12 overflow-y-auto">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-black">SEARCH</h2>
                <button id="close-search" class="text-4xl hover:text-cyan-400 transition">&times;</button>
            </div>
            <input type="text" id="search-input" placeholder="Type title, genre, or actor..." 
                   class="w-full bg-white/5 border-b-2 border-cyan-500 py-4 px-2 text-2xl outline-none focus:bg-white/10 transition">
            <div id="search-results" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 mt-12"></div>
        </div>
    </div>

    <div id="action-modal" class="fixed inset-0 z-[400] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="glass w-full max-w-sm rounded-[2.5rem] overflow-hidden p-8 relative flex flex-col items-center text-center shadow-2xl">
            <div id="modal-poster" class="w-36 h-52 rounded-[2rem] mb-5 shadow-2xl bg-cover bg-center skeleton"></div>
            <h4 id="modal-title" class="text-2xl font-black mb-6">Movie Title</h4>
            <div class="flex flex-col w-full gap-3">
                <a id="modal-watch" href="#" class="bg-cyan-500 py-4 rounded-2xl font-black flex items-center justify-center gap-2 hover:bg-cyan-600 transition">
                    <i class="fa-solid fa-play"></i> Watch Now
                </a>
                <a id="modal-details" href="#" class="bg-white/10 py-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-white/20 transition text-white">
                    <i class="fa-solid fa-circle-info"></i> View Details
                </a>
                <a id="modal-download" href="#" class="bg-emerald-500 py-4 rounded-2xl font-black flex items-center justify-center gap-2 hover:bg-emerald-600 transition text-white">
                    <i class="fa-solid fa-download"></i> Download
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
