<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Cymor Music Downloader</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  font-family: 'Poppins', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: #f8fafc;
  overflow-x: hidden;
}

.glass {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
}

.glass-dark {
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(25px);
}

.hidden { display: none; }

.active {
  border: 1px solid #3b82f6 !important;
  background: rgba(59,130,246,0.15);
}
</style>
</head>

<body class="pb-40">

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-50 px-5 py-5 glass-dark border-b border-white/10">

  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center">
        🎵
      </div>
      <div>
        <h1 class="font-black text-sm">Cymor Music Downloader</h1>
        <p class="text-[10px] text-gray-400">Elite Media Engine</p>
      </div>
    </div>

    <span class="text-[10px] px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
      ONLINE
    </span>
  </div>

  <!-- SEARCH -->
  <div class="mt-4 flex gap-2">

    <input id="search-input"
      class="flex-1 px-4 py-3 rounded-xl glass outline-none text-sm"
      placeholder="Search songs or artists..." />

    <button id="search-btn"
      class="px-5 py-3 rounded-xl bg-blue-600 font-bold text-sm active:scale-95">
      Go
    </button>

  </div>

</header>

<!-- ================= MAIN ================= -->
<main class="px-4 mt-4">

<!-- RESULTS -->
<section id="music-section">

  <h2 class="text-lg font-black mb-3">Results</h2>

  <div id="results-container" class="space-y-3"></div>

</section>

<!-- DOWNLOAD OPTIONS (HIDDEN UNTIL CLICK) -->
<section id="download-panel" class="hidden mt-6">

  <div class="glass rounded-3xl p-5 space-y-4">

    <h3 class="font-bold text-sm">Download Options</h3>

    <!-- FORMAT -->
    <div class="grid grid-cols-2 gap-3">
      <button id="mp3-btn" class="format-btn glass rounded-xl py-3">🎧 MP3</button>
      <button id="mp4-btn" class="format-btn glass rounded-xl py-3">🎬 MP4</button>
    </div>

    <!-- QUALITY -->
    <div class="grid grid-cols-2 gap-3">
      <button class="quality-btn glass rounded-xl py-2 text-xs">128KBPS</button>
      <button class="quality-btn glass rounded-xl py-2 text-xs">320KBPS</button>
      <button class="quality-btn glass rounded-xl py-2 text-xs">720P</button>
      <button class="quality-btn glass rounded-xl py-2 text-xs">1080P</button>
    </div>

    <button id="download-btn"
      class="w-full bg-blue-600 py-3 rounded-xl font-bold">
      Download
    </button>

  </div>

</section>

</main>

<!-- ================= FOOTER ================= -->
<footer class="mt-12 px-6 text-center space-y-4 pb-10">

  <div class="glass rounded-2xl p-5">
    <p class="text-xs text-gray-400">
      This site was built by the legendary
    </p>

    <p class="text-sm font-black text-blue-400 mt-1">
      Smiley Cymor — CEO of CymorTechServices
    </p>

    <p class="text-[10px] text-gray-500 mt-3">
      Special credits to Joyce ❤️ for inspiration and support
    </p>
  </div>

  <p class="text-[9px] text-gray-600 uppercase tracking-widest">
    © CymorTechServices 2026
  </p>

</footer>

<!-- ================= NAV ================= -->
<nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-md glass-dark rounded-3xl">

  <div class="grid grid-cols-3 text-center py-3 text-xs font-bold">

    <button class="text-blue-500">Home</button>
    <button>Search</button>
    <button>Vault</button>

  </div>

</nav>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

<script>
let selectedVideoId = null;

/* SHOW OPTIONS ONLY AFTER CLICK */
function openDownloadPanel(videoId) {
  selectedVideoId = videoId;
  document.getElementById("download-panel").classList.remove("hidden");
}

/* MOCK HOOK FOR YOUR script.js */
window.openDownloadPanel = openDownloadPanel;

/* You will call this from script.js:
   openDownloadPanel(videoId)
*/
</script>

</body>
</html>
