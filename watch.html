<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Cymor Movie Hub — Streaming</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #060d17;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .bg-blur {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            filter: blur(100px) brightness(0.15);
            transform: scale(1.2);
        }

        .overlay-dark {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.6),
                    rgba(0,0,0,0.9)
                );
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            border-radius: 2rem;
            overflow: hidden;
            background: black;
            box-shadow:
                0 25px 60px rgba(0,0,0,0.6);
        }

        .video-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .movie-card {
            position: relative;
            overflow: hidden;
            border-radius: 1.5rem;
            cursor: pointer;
            transition: 0.4s ease;
        }

        .movie-card:hover {
            transform: scale(1.04);
        }

        .movie-card img {
            transition: 0.5s ease;
        }

        .movie-card:hover img {
            transform: scale(1.1);
        }

        .skeleton {
            background: linear-gradient(
                90deg,
                #131a26 25%,
                #1f2937 50%,
                #131a26 75%
            );

            background-size: 200% 100%;

            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {

            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #06b6d4;
            border-radius: 20px;
        }

        .server-btn.active {
            background: rgba(6,182,212,0.2);
            color: #22d3ee;
            border-color: rgba(6,182,212,0.5);
        }
    </style>
</head>

<body>

    <!-- Dynamic Background -->
    <div id="dynamic-bg" class="bg-blur"></div>
    <div class="overlay-dark"></div>

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 w-full z-50 px-6 py-5 backdrop-blur-xl bg-black/30 border-b border-white/5">

        <div class="max-w-7xl mx-auto flex items-center justify-between">

            <a href="index.html"
                class="flex items-center gap-3 text-gray-300 hover:text-cyan-400 transition">

                <i class="fa-solid fa-arrow-left"></i>

                <span class="uppercase tracking-widest text-xs font-black">
                    Back
                </span>

            </a>

            <h1 class="text-xl font-black uppercase tracking-tight">

                <span class="text-cyan-400">
                    Cymor
                </span>

                Hub

            </h1>

        </div>

    </nav>

    <!-- Main -->
    <main class="pt-28 pb-20 px-4 md:px-10 lg:px-16 max-w-[1600px] mx-auto">

        <!-- Player Section -->
        <div class="flex flex-col xl:flex-row gap-8 mb-10">

            <!-- Player -->
            <section class="flex-[3]">

                <div
                    id="player-wrapper"
                    class="video-container"
                >

                    <iframe
                        id="video-player"
                        src=""
                        allowfullscreen
                        referrerpolicy="origin"
                        loading="eager"
                        importance="high"

                        allow="
                            autoplay;
                            encrypted-media;
                            picture-in-picture;
                            fullscreen
                        "

                        sandbox="
                            allow-scripts
                            allow-same-origin
                            allow-forms
                            allow-presentation
                        "
                    ></iframe>

                </div>

                <!-- Server Buttons -->
                <div class="flex flex-wrap items-center gap-3 mt-5">

                    <span class="text-xs uppercase tracking-widest font-black text-gray-500">
                        Servers:
                    </span>

                    <button
                        id="server-primary"
                        onclick="switchServer(0)"
                        class="server-btn active border border-white/10 px-4 py-2 rounded-full text-xs font-bold transition"
                    >
                        Primary
                    </button>

                    <button
                        id="server-fallback"
                        onclick="switchServer(1)"
                        class="server-btn border border-white/10 px-4 py-2 rounded-full text-xs font-bold transition hover:bg-white/5"
                    >
                        Fallback
                    </button>

                    <button
                        id="server-backup"
                        onclick="switchServer(2)"
                        class="server-btn border border-white/10 px-4 py-2 rounded-full text-xs font-bold transition hover:bg-white/5"
                    >
                        Backup
                    </button>

                </div>

                <!-- Subtitles -->
                <div
                    id="subtitle-controls"
                    class="mt-5 flex flex-wrap gap-3"
                >
                    <span class="text-xs opacity-40">
                        Loading subtitles...
                    </span>
                </div>

            </section>

            <!-- Episodes -->
            <aside
                id="episode-parent"
                class="flex-[1] hidden"
            >

                <div class="glass rounded-[2rem] overflow-hidden max-h-[700px] flex flex-col">

                    <div class="p-5 border-b border-white/10 flex items-center justify-between">

                        <h2 class="font-black uppercase tracking-widest text-sm text-cyan-400">
                            Episodes
                        </h2>

                        <span
                            id="season-label"
                            class="text-xs opacity-60"
                        >
                            Season 1
                        </span>

                    </div>

                    <div
                        id="episode-selector-container"
                        class="overflow-y-auto custom-scroll p-4 space-y-3"
                    >

                        <div class="h-14 rounded-2xl skeleton"></div>
                        <div class="h-14 rounded-2xl skeleton"></div>
                        <div class="h-14 rounded-2xl skeleton"></div>

                    </div>

                </div>

            </aside>

        </div>

        <!-- Details -->
        <section class="flex flex-col lg:flex-row gap-10 border-b border-white/5 pb-16 mb-16">

            <!-- Left -->
            <div class="flex-1">

                <div class="flex items-center gap-4 flex-wrap mb-5">

                    <span class="bg-cyan-500 text-black px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">
                        ULTRA HD
                    </span>

                    <span
                        id="watch-rating"
                        class="text-yellow-400 font-black text-sm"
                    >
                        ★ --
                    </span>

                    <span
                        id="watch-year"
                        class="text-gray-400 text-sm font-bold"
                    >
                        ----
                    </span>

                </div>

                <h1
                    id="watch-title"
                    class="text-4xl md:text-6xl font-black uppercase tracking-tight mb-6"
                >
                    Loading...
                </h1>

                <p
                    id="watch-desc"
                    class="text-gray-400 text-lg leading-relaxed max-w-4xl"
                >
                    Fetching movie details...
                </p>

            </div>

            <!-- Actions -->
            <div class="w-full lg:w-[320px]">

                <div class="glass rounded-[2rem] p-6 space-y-4">

                    <a
                        id="btn-download"
                        href="#"
                        class="bg-cyan-500 hover:bg-cyan-600 transition text-black py-4 rounded-2xl font-black flex items-center justify-center gap-3"
                    >

                        <i class="fa-solid fa-download"></i>

                        DOWNLOAD

                    </a>

                    <button
                        onclick="window.history.back()"
                        class="w-full glass hover:bg-white/10 transition py-4 rounded-2xl font-bold flex items-center justify-center gap-3"
                    >

                        <i class="fa-solid fa-arrow-left"></i>

                        Go Back

                    </button>

                    <button
                        onclick="shareMovie()"
                        class="w-full glass hover:bg-white/10 transition py-4 rounded-2xl font-bold flex items-center justify-center gap-3"
                    >

                        <i class="fa-solid fa-share-nodes"></i>

                        Share

                    </button>

                </div>

            </div>

        </section>

        <!-- Recommendations -->
        <section>

            <div class="flex items-center gap-4 mb-10">

                <div class="w-1 h-8 bg-cyan-400 rounded-full"></div>

                <h2 class="text-3xl font-black uppercase italic tracking-tight">
                    More Like This
                </h2>

            </div>

            <div
                id="recommended-grid"
                class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6"
            >

                <div class="movie-card skeleton h-80"></div>
                <div class="movie-card skeleton h-80"></div>
                <div class="movie-card skeleton h-80"></div>
                <div class="movie-card skeleton h-80"></div>
                <div class="movie-card skeleton h-80"></div>
                <div class="movie-card skeleton h-80"></div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

    <script>

        let activeServers = [];

        function switchServer(index) {

            if (!activeServers[index]) return;

            const player =
                document.getElementById(
                    'video-player'
                );

            player.src =
                activeServers[index];

            document
                .querySelectorAll('.server-btn')
                .forEach(btn => {
                    btn.classList.remove('active');
                });

            const ids = [
                'server-primary',
                'server-fallback',
                'server-backup'
            ];

            document
                .getElementById(ids[index])
                ?.classList.add('active');
        }

        // Hook setupPlayer from script.js
        const oldSetupPlayer =
            window.setupPlayer;

        window.setupPlayer = function(streams) {

            activeServers = [
                streams.primary,
                streams.fallback,
                streams.backup
            ];

            if (typeof oldSetupPlayer === 'function') {
                oldSetupPlayer(streams);
            }
        };

        function shareMovie() {

            if (navigator.share) {

                navigator.share({
                    title:
                        document.getElementById(
                            'watch-title'
                        ).innerText,

                    url:
                        window.location.href
                });
            }
        }

    </script>

</body>
</html>
