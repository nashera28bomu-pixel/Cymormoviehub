<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Streaming - Cymor Movie Hub</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

        body {
            background:#060d17;
            color:white;
            font-family:'Inter',sans-serif;
            overflow-x:hidden;
        }

        .glass {
            background:rgba(255,255,255,0.03);
            backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.08);
        }

        /* Netflix Style Player Ratio */
        .video-container {
            position:relative;
            padding-bottom:56.25%; /* 16:9 */
            height:0;
            overflow:hidden;
            border-radius:1.5rem;
            background:black;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
        }

        .video-container iframe {
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            border:0;
        }

        .skeleton {
            background: linear-gradient(90deg, #131a26 25%, #1f2937 50%, #131a26 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Movie Card Styling */
        .movie-card {
            position:relative;
            overflow:hidden;
            border-radius:1.2rem;
            cursor:pointer;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            height: 300px;
        }

        .movie-card:hover { transform: scale(1.05); z-index: 10; }

        .movie-overlay {
            position:absolute;
            inset:0;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 60%);
            display:flex;
            flex-direction:column;
            justify-content:flex-end;
            padding:1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .movie-card:hover .movie-overlay { opacity: 1; }

        /* Custom Scrollbar for Episode List */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }

        .bg-blur {
            position:fixed;
            inset:0;
            z-index:-1;
            background-size:cover;
            background-position:center;
            filter:blur(100px) brightness(0.15);
            transform:scale(1.2);
        }
    </style>
</head>

<body class="pb-20">

    <div id="dynamic-bg" class="bg-blur"></div>

    <nav class="fixed top-0 left-0 w-full z-50 px-6 py-4 bg-gradient-to-b from-black/95 to-transparent backdrop-blur-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 group text-gray-300 hover:text-cyan-400 transition">
                <i class="fa-solid fa-arrow-left text-lg group-hover:-translate-x-1 transition"></i>
                <span class="uppercase text-xs tracking-widest font-black">Back to Hub</span>
            </a>
            <div class="flex items-center gap-2">
                <h1 class="font-black uppercase tracking-tighter text-xl">
                    <span class="text-cyan-400">Cymor</span> Hub
                </h1>
            </div>
        </div>
    </nav>

    <main class="pt-24 px-4 md:px-10 lg:px-20 max-w-[1600px] mx-auto">
        
        <div class="flex flex-col xl:flex-row gap-8 mb-12">
            
            <div class="flex-[3]">
                <div class="video-container">
                    <iframe
                        id="video-player"
                        src=""
                        allowfullscreen
                        scrolling="no"
                        sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation">
                    </iframe>
                </div>
            </div>

            <div id="episode-parent" class="flex-[1] hidden">
                <div class="glass rounded-[1.5rem] h-full max-h-[500px] xl:max-h-full overflow-hidden flex flex-col">
                    <div class="p-5 border-b border-white/10 flex justify-between items-center bg-white/5">
                        <h3 class="font-black text-sm uppercase tracking-widest text-cyan-400">Episodes</h3>
                        <span id="season-label" class="text-xs font-bold opacity-60">Season 1</span>
                    </div>
                    <div id="episode-selector-container" class="p-4 overflow-y-auto custom-scroll space-y-3">
                        <div class="h-12 skeleton rounded-xl"></div>
                        <div class="h-12 skeleton rounded-xl"></div>
                        <div class="h-12 skeleton rounded-xl"></div>
                    </div>
                </div>
            </div>
        </div>

        <section class="flex flex-col lg:flex-row gap-10 border-b border-white/5 pb-16 mb-16">
            <div class="flex-1">
                <div class="flex items-center gap-3 mb-6">
                    <span class="bg-cyan-500 text-black px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">4K ULTRA HD</span>
                    <span id="watch-rating" class="text-yellow-400 font-black text-sm">
                        <i class="fa-solid fa-star"></i> --
                    </span>
                    <span id="watch-year" class="text-gray-400 font-bold text-sm">----</span>
                </div>

                <h1 id="watch-title" class="text-4xl md:text-6xl font-black mb-6 uppercase tracking-tighter leading-none">Loading Title...</h1>
                
                <p id="watch-desc" class="text-gray-400 leading-relaxed text-lg max-w-4xl">
                    Loading description from TMDB...
                </p>
            </div>

            <div class="w-full lg:w-[300px] shrink-0">
                <div class="glass rounded-[2rem] p-6 space-y-4">
                    <a id="btn-download" href="download.html" class="bg-cyan-500 hover:bg-cyan-600 text-black py-4 rounded-2xl font-black flex items-center justify-center gap-3 transition transform hover:scale-[1.02]">
                        <i class="fa-solid fa-download text-lg"></i> DOWNLOAD
                    </a>
                    <button class="w-full glass hover:bg-white/10 py-4 rounded-2xl font-bold transition flex items-center justify-center gap-3">
                        <i class="fa-solid fa-plus"></i> My List
                    </button>
                    <button class="w-full glass hover:bg-white/10 py-4 rounded-2xl font-bold transition flex items-center justify-center gap-3">
                        <i class="fa-solid fa-share-nodes"></i> Share
                    </button>
                </div>
            </div>
        </section>

        <section>
            <div class="flex items-center gap-4 mb-10">
                <div class="w-1 h-8 bg-cyan-400 rounded-full"></div>
                <h2 class="text-3xl font-black uppercase tracking-tighter italic">More Like This</h2>
            </div>

            <div id="recommended-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
                <div class="movie-card skeleton"></div>
                <div class="movie-card skeleton"></div>
                <div class="movie-card skeleton"></div>
                <div class="movie-card skeleton"></div>
                <div class="movie-card skeleton"></div>
                <div class="movie-card skeleton"></div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
    <script>
        // Special logic to handle the episode sidebar visibility
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const type = params.get("type");
            if (type === "tv") {
                document.getElementById("episode-parent").classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
